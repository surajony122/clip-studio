services:
  - type: web
    name: clip-studio
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_PASSWORD
        sync: false        # you type this in the Render dashboard; never commit it
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "200"
