<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Clip Studio{% endblock %}</title>
{% block head %}{% endblock %}
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1b1b1b; --muted:#666; --line:#e2e2dd; --accent:#d9381e; --ok:#1d7a46; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --card:#1e1e1e; --ink:#eee; --muted:#9a9a9a; --line:#333; --accent:#ff6a4d; --ok:#4cc380; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; max-width:820px; margin:0 auto; }
  header a.brand { font-weight:700; color:var(--ink); text-decoration:none; }
  h1 { font-size:1.4rem; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  input[type=text], input[type=password], input[type=number], input[type=file], select, textarea {
    width:100%; padding:10px; font:inherit; color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:8px; }
  textarea { min-height: 80px; resize: vertical; }
  button, .btn { font:inherit; padding:10px 16px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .pill { font-size:.75rem; padding:2px 8px; border-radius:99px; border:1px solid var(--line); }
  .pill.ready, .pill.approved, .pill.posted { color:var(--ok); border-color:var(--ok); }
  .pill.failed, .pill.rejected { color:var(--accent); border-color:var(--accent); }
  .err { color:var(--accent); }
  video { width:100%; max-height:70vh; background:#000; border-radius:8px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">Clip Studio</a>
  {% if request.cookies.get('session') %}
  <form method="post" action="/logout"><button type="submit">Log out</button></form>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
